# Smart Attendance on one VM: API + nginx (HTTPS, admin panel) + certbot.
# MySQL is the VM's existing server, reached at host.docker.internal.
# See DEPLOY.md for the full walkthrough.

services:
  api:
    build: ../server
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      PORT: "8080"
      UPLOAD_DIR: /data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/uploads:/data/uploads
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload every 6 h to pick up renewed certificates.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
